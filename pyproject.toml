[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-code-review"
version = "0.1.0"
description = "A multi-agent AI system that reviews code changes with specialist reviewers"
readme = "README.md"

requires-python = ">=3.11"

dependencies = [

    "python-dotenv>=1.0.0",

    "pydantic>=2.0.0",

    "pydantic-settings>=2.0.0",

    "unidiff>=1.0.0",

    "bandit>=1.7.0",

    "rich>=13.0.0",

    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",

    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",

    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1.0",

    "python-multipart>=0.0.9",

    "httpx>=0.27.0",

    "cloudinary>=1.38.0",

    "email-validator>=2.0.0",

    "pymupdf>=1.24.0",
]

[project.scripts]
code-review = "code_review.cli.main:main"

[project.optional-dependencies]
dev = [

    "pytest>=8.0.0",

    "pytest-cov>=5.0.0",

    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/code_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/code_review"]
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.ruff]
line-length = 99
src = ["src", "tests", "scripts"]
extend-exclude = ["tests/fixtures", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
